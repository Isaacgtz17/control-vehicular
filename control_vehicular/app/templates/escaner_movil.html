<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escanear QR Vehicular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      #reader {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border: 4px solid #3b82f6;
        border-radius: 1rem;
        overflow: hidden;
      }
      .status-message {
        display: none;
        padding: 1rem;
        margin-top: 1.5rem;
        border-radius: 0.5rem;
        text-align: center;
        font-weight: 500;
      }
      .status-message.success {
        background-color: #dcfce7;
        color: #166534;
      }
      .status-message.error {
        background-color: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4"
  >
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold">Control de Acceso Vehicular</h1>
      <p class="text-gray-400 mt-2">
        Apunte la cámara al código QR de la unidad.
      </p>
    </div>

    <div id="reader"></div>

    <div id="result" class="status-message"></div>

    <!-- CORRECCIÓN APLICADA AQUÍ -->
    <a
      href="{{ url_for('main.dashboard_vigilante') }}"
      class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg"
    >
      Volver al Dashboard
    </a>

    <script>
      let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,
          qrbox: { width: 250, height: 250 },
        },
        /* verbose= */ false
      );
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
      function onScanSuccess(decodedText, decodedResult) {
        html5QrcodeScanner.clear();
        const resultDiv = document.getElementById("result");
        resultDiv.textContent = "Procesando QR...";
        resultDiv.className = "status-message success";
        resultDiv.style.display = "block";

        const formData = new FormData();
        formData.append("qr_data", decodedText);

        fetch("{{ url_for('main.process_qr') }}", {
          method: "POST",
          body: formData,
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              resultDiv.textContent = "¡Éxito! Redirigiendo...";
              window.location.href = data.redirect_url;
            } else {
              resultDiv.textContent = "Error: " + data.message;
              resultDiv.className = "status-message error";
              setTimeout(() => {
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
                resultDiv.style.display = "none";
              }, 3000);
            }
          })
          .catch((error) => {
            console.error("Error en la petición fetch:", error);
            resultDiv.textContent = "Error de conexión. Intente de nuevo.";
            resultDiv.className = "status-message error";
            setTimeout(() => {
              html5QrcodeScanner.render(onScanSuccess, onScanFailure);
              resultDiv.style.display = "none";
            }, 3000);
          });
      }

      function onScanFailure(error) {
        // No hacer nada en caso de fallo, para que el usuario pueda seguir intentando.
      }
    </script>
  </body>
</html>
