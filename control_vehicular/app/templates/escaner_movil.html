<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escanear QR Vehicular</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode/minified/html5-qrcode.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      #reader {
        width: 100%;
        max-width: 500px;
        margin: 0 auto;
        border: 4px solid #3b82f6;
        border-radius: 1rem;
        overflow: hidden;
      }
      .status-message {
        display: none;
        padding: 1rem;
        margin-top: 1.5rem;
        border-radius: 0.5rem;
        text-align: center;
        font-weight: 500;
      }
      .status-message.success {
        background-color: #dcfce7;
        color: #166534;
      }
      .status-message.error {
        background-color: #fee2e2;
        color: #991b1b;
      }
    </style>
  </head>
  <body
    class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4"
  >
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold">Control de Acceso Vehicular</h1>
      <p class="text-gray-400 mt-2">
        Apunte la cámara al código QR de la unidad.
      </p>
    </div>

    <div id="reader"></div>

    <div id="result" class="status-message"></div>

    <a
      href="{{ url_for('dashboard_vigilante') }}"
      class="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg"
    >
      Volver al Dashboard
    </a>

    <script>
      function onScanSuccess(decodedText, decodedResult) {
        // Detener el escáner para evitar múltiples envíos
        html5QrcodeScanner.clear();

        // Mostrar un mensaje de procesamiento
        const resultDiv = document.getElementById("result");
        resultDiv.textContent = "Procesando QR...";
        resultDiv.className = "status-message success";
        resultDiv.style.display = "block";

        // Crear un FormData para enviar el dato
        const formData = new FormData();
        formData.append("qr_data", decodedText);

        // Enviar el dato al servidor usando fetch
        fetch("/process-qr", {
          method: "POST",
          body: formData,
          // Añadir el token CSRF si estás usando Flask-WTF con protección
          headers: {
            // 'X-CSRFToken': '{{ csrf_token() }}' // Descomentar si usas CSRF
          },
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              // Si el servidor responde con éxito, redirigir a la URL que nos indica
              resultDiv.textContent =
                "¡Éxito! Redirigiendo al proceso de revisión...";
              window.location.href = data.redirect_url;
            } else {
              // Si hay un error, mostrarlo y reiniciar el escáner
              resultDiv.textContent = "Error: " + data.message;
              resultDiv.className = "status-message error";
              // Opcional: reiniciar el escáner después de un error
              setTimeout(() => {
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
                resultDiv.style.display = "none";
              }, 3000);
            }
          })
          .catch((error) => {
            console.error("Error en la petición fetch:", error);
            resultDiv.textContent = "Error de conexión. Intente de nuevo.";
            resultDiv.className = "status-message error";
            // Reiniciar el escáner
            setTimeout(() => {
              html5QrcodeScanner.render(onScanSuccess, onScanFailure);
              resultDiv.style.display = "none";
            }, 3000);
          });
      }

      function onScanFailure(error) {
        // Manejar errores de escaneo (no es un error crítico)
        // console.warn(`Error de escaneo = ${error}`);
      }

      let html5QrcodeScanner = new Html5QrcodeScanner("reader", {
        fps: 10,
        qrbox: 250,
      });
      html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
  </body>
</html>
